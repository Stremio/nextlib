jdk:
  - openjdk8
env:
  CMDLT: "14742923"
  NDK: "29.0.14206865"

before_install:
  - wget https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -O miniforge.sh
  - bash miniforge.sh -b -p $HOME/miniforge
  - export PATH="$HOME/miniforge/bin:$PATH"

  - pip install meson ninja

  - wget https://pkgconfig.freedesktop.org/releases/pkg-config-0.29.2.tar.gz
  - tar xzf pkg-config-0.29.2.tar.gz
  - cd pkg-config-0.29.2 && ./configure --prefix=$HOME/local --with-internal-glib && make -j2 && make install && cd ..
  - export PATH="$HOME/local/bin:$PATH"

  - wget https://dl.google.com/android/repository/commandlinetools-linux-${CMDLT}_latest.zip -O commandlinetools.zip
  - unzip commandlinetools.zip -d $ANDROID_HOME/cmdline-tools
  - mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
  - yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;${NDK}"
  - yes | sdkmanager "cmake;3.22.1"
  - sdk install java 17.0.8-tem
  - sdk use java 17.0.8-tem

install:
  - ./gradlew publishToMavenLocal